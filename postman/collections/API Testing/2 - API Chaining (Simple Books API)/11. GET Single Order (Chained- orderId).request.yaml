$kind: http-request
name: "11. GET Single Order (Chained: orderId)"
description: Task 7 (API Chaining Step 4) — Fetch order details using orderId and accessToken from previous steps
url: "{{booksBaseUrl}}/orders/{{orderId}}"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
scripts:
  - type: beforeRequest
    code: |-
      pm.request.headers.upsert({
          key: 'Authorization', 
          value: 'Bearer ' + pm.globals.get('accessToken')
      });
      pm.collectionVariables.set('orderId', pm.globals.get('orderId'));

      // Task 6: Pre-request check
      const orderId = pm.collectionVariables.get('orderId');
      console.log('Pre-request: Fetching order with orderId =', orderId);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Order ID matches expected', function () {
          const json = pm.response.json();
          pm.expect(json.id).to.equal(pm.collectionVariables.get('orderId'));
      });

      pm.test('Customer name is present', function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property('customerName');
          pm.expect(json.customerName).to.equal(pm.collectionVariables.get('customerName'));
      });

      pm.test('Book ID matches what we ordered', function () {
          const json = pm.response.json();
          pm.expect(String(json.bookId)).to.equal(String(pm.collectionVariables.get('bookId')));
      });

      // Task 4: Log order details
      const order = pm.response.json();
      console.log('--- Task 4: Order Details ---');
      console.log('Order ID:', order.id);
      console.log('Book ID:', order.bookId);
      console.log('Customer:', order.customerName);
      console.log('Quantity:', order.quantity);
      console.log('Timestamp:', order.timestamp);
    language: text/javascript
order: 4000
